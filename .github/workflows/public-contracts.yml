name: Main text and environment contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check text configurations and environment reporting in Docker
        run: |
          docker run --rm \
            --mount "type=bind,src=$PWD,dst=/workspace/slime,readonly" \
            --workdir /workspace/slime \
            -e PYTHONPYCACHEPREFIX=/tmp/resail_pycache \
            python:3.12.3-slim bash -lc '
              python3 -m pip install pytest==9.0.3 PyYAML==6.0.2 &&
              bash scripts/check_public_contracts.sh -p no:cacheprovider
            '
